name: Magnet to Direct HTTP Converter
run-name: "convert-${{ inputs.quality }}-${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI or direct .torrent URL'
        required: true
        type: string
      title:
        description: 'Movie title'
        required: true
        type: string
      quality:
        description: 'Quality (1080p or 720p)'
        required: false
        default: '1080p'
        type: string
      job_id:
        description: 'Unique job ID for parallel run correlation'
        required: true
        type: string
      token:
        description: 'GitHub Personal Access Token'
        required: false
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask token
        run: |
          if [ -n "${{ inputs.token }}" ]; then
            echo "::add-mask::${{ inputs.token }}"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl python3
          curl -sL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Show inputs
        run: |
          echo "Title=${{ inputs.title }} Quality=${{ inputs.quality }} JobID=${{ inputs.job_id }}"

      - name: Short torrent health probe
        id: health
        run: |
          set -e
          mkdir -p /tmp/health-probe
          cd /tmp/health-probe
          curl -sS -L --connect-timeout 5 \
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt" \
            -o /tmp/probe-trackers.txt || true
          TRACKERS=$(grep -v '^$' /tmp/probe-trackers.txt 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          INPUT="${{ inputs.magnet }}"
          if echo "$INPUT" | grep -qE '^magnet:'; then
            PROBE_INPUT="$INPUT"
          elif echo "$INPUT" | grep -qE '^https?://.*\.torrent'; then
            curl -fsSL --connect-timeout 15 -o /tmp/probe.torrent "$INPUT"
            file /tmp/probe.torrent | grep -qi 'torrent\|bittorrent' || { echo "Invalid .torrent input"; exit 1; }
            PROBE_INPUT="/tmp/probe.torrent"
          else
            echo "Invalid transfer input"
            exit 1
          fi
          OPTS="--bt-metadata-only=true --seed-time=0 --enable-dht=true --bt-enable-lpd=true \
            --bt-stop-timeout=45 --timeout=45 --connect-timeout=15 --summary-interval=15 \
            --max-overall-upload-limit=1K --file-allocation=none"
          [ -n "$TRACKERS" ] && OPTS="$OPTS --bt-tracker=$TRACKERS"
          echo "Starting 45-second metadata/peer health probe..."
          aria2c $OPTS "$PROBE_INPUT"
          echo "Health probe passed: torrent metadata obtained."

      - name: Download via aria2
        id: download
        run: |
          set -e
          mkdir -p downloads
          cd downloads

          curl -sS -L --connect-timeout 5 \
            "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt" \
            -o /tmp/trackers.txt || true
          TRACKERS=$(grep -v '^$' /tmp/trackers.txt 2>/dev/null | tr '\n' ',' | sed 's/,$//')

          INPUT="${{ inputs.magnet }}"
          USE_TORRENT_FILE=0

          if echo "$INPUT" | grep -qE '^magnet:'; then
            echo "Using magnet URI directly."
            ARIA_INPUT="$INPUT"
          elif echo "$INPUT" | grep -qE '^https?://.*\.torrent'; then
            echo "Downloading .torrent metadata first..."
            curl -sS -L --connect-timeout 15 -o /tmp/input.torrent "$INPUT"
            if file /tmp/input.torrent | grep -qi 'torrent\|bittorrent'; then
              echo "Valid .torrent confirmed."
              USE_TORRENT_FILE=1
            else
              echo "ERROR: not a valid torrent file."
              head -c 200 /tmp/input.torrent || true
              exit 1
            fi
          else
            echo "ERROR: input is not a magnet URI or .torrent URL."
            exit 1
          fi

          ARIA_COMMON_OPTS="--seed-time=0 --max-overall-download-limit=0 \
            --max-download-limit=0 --max-overall-upload-limit=1K \
            --split=16 --max-connection-per-server=16 --min-split-size=1M \
            --bt-max-peers=200 --disk-cache=64M --file-allocation=none \
            --enable-dht=true --bt-enable-lpd=true --follow-torrent=mem \
            --summary-interval=30 --bt-stop-timeout=300 --timeout=120"

          if [ -n "$TRACKERS" ]; then
            ARIA_COMMON_OPTS="$ARIA_COMMON_OPTS --bt-tracker=$TRACKERS"
          fi

          if [ "$USE_TORRENT_FILE" = "1" ]; then
            aria2c $ARIA_COMMON_OPTS /tmp/input.torrent
          else
            aria2c $ARIA_COMMON_OPTS "$ARIA_INPUT"
          fi

          python3 - << 'PYEOF'
          import os, sys, shutil
          videos = []
          for root, dirs, files in os.walk("."):
              for f in files:
                  ext = os.path.splitext(f)[1].lower()
                  if ext in [".mp4", ".mkv", ".avi", ".ts", ".webm", ".m4v"]:
                      full = os.path.join(root, f)
                      try:
                          sz = os.path.getsize(full)
                          if sz > 10 * 1024 * 1024:
                              videos.append((sz, full, f))
                      except OSError:
                          pass
          if not videos:
              print("ERROR: No video file >= 10MB found!")
              sys.exit(1)
          videos.sort(key=lambda x: x[0], reverse=True)
          sz, path, name = videos[0]
          ext = os.path.splitext(name)[1].lower()
          base = os.path.splitext(name)[0]
          clean = "".join(c if c.isalnum() or c in "._-" else "_" for c in base) + ext
          dest = os.path.abspath(clean)
          if os.path.abspath(path) != dest:
              shutil.move(path, dest)
          szh = f"{sz/(1024*1024):.1f}MB" if sz < 1024**3 else f"{sz/(1024**3):.2f}GB"
          print(f"Video: {clean} ({szh})")
          gh = os.environ.get("GITHUB_OUTPUT")
          if gh:
              open(gh, "a").write(f"filepath=downloads/{clean}\nfilename={clean}\nfilesize={szh}\n")
          PYEOF

      - name: Start Cloudflare Tunnel and signal release
        id: tunnel
        env:
          GH_TOKEN: ${{ inputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          JOB_ID="${{ inputs.job_id }}"
          TAG_NAME="temp-${JOB_ID}"
          FILENAME="${{ steps.download.outputs.filename }}"
          REPO="${{ github.repository }}"

          cd downloads && python3 -m http.server 8080 & cd ..
          cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > /tmp/tunnel.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 40); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$TUNNEL_URL" ] && break
            sleep 1
          done

          printf 'JOB_ID=%s\nQUALITY=%s\nTITLE=%s\n' \
            "$JOB_ID" "${{ inputs.quality }}" "${{ inputs.title }}" > /tmp/notes.txt

          if [ -z "$TUNNEL_URL" ]; then
            echo "Tunnel failed — fallback to release asset."
            ASSET_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${FILENAME}"
            printf 'FALLBACK_ASSET=true\nDIRECT_URL=%s\n' "$ASSET_URL" >> /tmp/notes.txt
            gh release create "$TAG_NAME" "${{ steps.download.outputs.filepath }}" \
              --title "Temp-${TAG_NAME}" --notes "$(cat /tmp/notes.txt)"
          else
            DIRECT_URL="${TUNNEL_URL}/${FILENAME}"
            echo "Cloudflare URL = $DIRECT_URL"
            printf 'DIRECT_URL=%s\n' "$DIRECT_URL" >> /tmp/notes.txt
            gh release create "$TAG_NAME" \
              --title "Temp-${TAG_NAME}" --notes "$(cat /tmp/notes.txt)"
          fi

          echo "Waiting for cancel signal from local uploader..."
          while true; do sleep 10; done
