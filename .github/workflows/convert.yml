name: Magnet to Direct HTTP Converter

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI to convert'
        required: true
        type: string
      title:
        description: 'Movie title'
        required: true
        type: string
      quality:
        description: 'Quality (720p/1080p)'
        required: false
        type: string
        default: '1080p'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Install aria2 & gh CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl
      
      - name: 📊 Display inputs
        run: |
          echo "🎬 Title: ${{ inputs.title }}"
          echo "📺 Quality: ${{ inputs.quality }}"
      
      - name: ⬇️ Download torrent via aria2
        id: download
        run: |
          set -e
          mkdir -p downloads
          cd downloads
          
          echo "🚀 Starting High-Speed Download..."
          aria2c \
            --seed-time=0 \
            --max-overall-download-limit=0 \
            --max-download-limit=0 \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=1M \
            --bt-max-peers=100 \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --follow-torrent=mem \
            --file-allocation=none \
            --summary-interval=10 \
            --timeout=120 \
            "${{ inputs.magnet }}"
          
          # Find the largest media file
          LARGEST_FILE=$(find . -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" \) | head -1)
          if [ -z "$LARGEST_FILE" ]; then
            LARGEST_FILE=$(find . -type f -exec ls -lh {} + | sort -k5 -hr | head -1 | awk '{print $NF}')
          fi
          
          if [ -z "$LARGEST_FILE" ]; then
            echo "❌ No file downloaded"
            exit 1
          fi
          
          echo "✅ Downloaded: $LARGEST_FILE"
          FILE_SIZE=$(du -h "$LARGEST_FILE" | cut -f1)
          echo "📦 Size: $FILE_SIZE"
          
          # Clean file name
          CLEAN_NAME=$(basename "$LARGEST_FILE" | tr ' ' '_' | tr -cd '[:alnum:]_.-')
          if [ "$LARGEST_FILE" != "./$CLEAN_NAME" ]; then
            mv "$LARGEST_FILE" "./$CLEAN_NAME"
          fi
          
          echo "filepath=downloads/$CLEAN_NAME" >> $GITHUB_OUTPUT
          echo "filename=$CLEAN_NAME" >> $GITHUB_OUTPUT
          echo "filesize=$FILE_SIZE" >> $GITHUB_OUTPUT
      
      - name: 📦 Create GitHub Release & Upload Asset
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="temp-$(date +%s)"
          FILEPATH="${{ steps.download.outputs.filepath }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          
          echo "Creating temporary release $TAG_NAME..."
          gh release create "$TAG_NAME" "$FILEPATH" \
            --title "Temp Release $TAG_NAME" \
            --notes "Temporary movie asset for remote upload pipeline"
          
          REPO="${{ github.repository }}"
          DIRECT_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${FILENAME}"
          
          echo "✅ Direct Remote URL: $DIRECT_URL"
          echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
      
      - name: 📋 Summary
        if: success()
        run: |
          echo "## ✅ Conversion Complete!" >> $GITHUB_STEP_SUMMARY
          echo "**🎬 Movie:** ${{ inputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**📦 Size:** ${{ steps.download.outputs.filesize }}" >> $GITHUB_STEP_SUMMARY
          echo "**🏷️ Release Tag:** ${{ steps.release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 Direct URL:** ${{ steps.release.outputs.direct_url }}" >> $GITHUB_STEP_SUMMARY
