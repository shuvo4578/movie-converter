name: Magnet to Direct HTTP Converter

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI to convert'
        required: true
        type: string
      title:
        description: 'Movie title'
        required: true
        type: string
      quality:
        description: 'Quality (720p/1080p)'
        required: false
        type: string
        default: '1080p'
      token:
        description: 'GitHub token for release upload'
        required: false
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔒 Mask Token
        run: |
          if [ -n "${{ inputs.token }}" ]; then
            echo "::add-mask::${{ inputs.token }}"
          fi
      
      - name: 🔧 Install aria2 & gh CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl python3
      
      - name: 📊 Display inputs
        run: |
          echo "🎬 Title: ${{ inputs.title }}"
          echo "📺 Quality: ${{ inputs.quality }}"
      
      - name: ⬇️ Download torrent via aria2
        id: download
        run: |
          set -e
          mkdir -p downloads
          cd downloads
          
          echo "🚀 Starting High-Speed Torrent Download..."
          aria2c \
            --seed-time=0 \
            --max-overall-download-limit=0 \
            --max-download-limit=0 \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=1M \
            --bt-max-peers=100 \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --follow-torrent=mem \
            --file-allocation=none \
            --summary-interval=10 \
            --bt-stop-timeout=300 \
            --timeout=120 \
            "${{ inputs.magnet }}"
          
          # Use Python to accurately locate largest video file and rename it
          python3 - << 'PYEOF'
          import os, sys, shutil

          videos = []
          for root, dirs, files in os.walk("."):
              for f in files:
                  ext = os.path.splitext(f)[1].lower()
                  if ext in [".mp4", ".mkv", ".avi", ".ts", ".webm", ".m4v"]:
                      full_path = os.path.join(root, f)
                      try:
                          sz = os.path.getsize(full_path)
                          if sz > 10 * 1024 * 1024:  # At least 10 MB
                              videos.append((sz, full_path, f))
                      except OSError:
                          pass

          if not videos:
              print("❌ No video media file found in torrent download!")
              sys.exit(1)

          videos.sort(key=lambda x: x[0], reverse=True)
          largest_size, largest_path, orig_name = videos[0]

          # Clean filename
          clean_name = "".join(c if c.isalnum() or c in "._-" else "_" for c in orig_name)
          dest_path = os.path.abspath(clean_name)
          
          if os.path.abspath(largest_path) != dest_path:
              shutil.move(largest_path, dest_path)

          size_human = f"{largest_size / (1024*1024):.1f} MB" if largest_size < 1024*1024*1024 else f"{largest_size / (1024*1024*1024):.2f} GB"
          print(f"✅ Downloaded Video: {clean_name} ({size_human})")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"filepath=downloads/{clean_name}\n")
                  f.write(f"filename={clean_name}\n")
                  f.write(f"filesize={size_human}\n")
          PYEOF
      
      - name: 📦 Create GitHub Release & Upload Asset
        id: release
        env:
          GH_TOKEN: ${{ inputs.token || secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="temp-$(date +%s)"
          FILEPATH="${{ steps.download.outputs.filepath }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          
          echo "Creating temporary release $TAG_NAME with asset $FILEPATH..."
          gh release create "$TAG_NAME" "$FILEPATH" \
            --title "Temp Release $TAG_NAME" \
            --notes "Temporary movie asset for remote upload pipeline"
          
          REPO="${{ github.repository }}"
          DIRECT_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${FILENAME}"
          
          echo "✅ Direct Remote URL: $DIRECT_URL"
          echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
      
      - name: 📋 Summary
        if: success()
        run: |
          echo "## ✅ Conversion Complete!" >> $GITHUB_STEP_SUMMARY
          echo "**🎬 Movie:** ${{ inputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**📦 Size:** ${{ steps.download.outputs.filesize }}" >> $GITHUB_STEP_SUMMARY
          echo "**🏷️ Release Tag:** ${{ steps.release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 Direct URL:** ${{ steps.release.outputs.direct_url }}" >> $GITHUB_STEP_SUMMARY
