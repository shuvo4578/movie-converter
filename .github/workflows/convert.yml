name: Magnet to Direct HTTP Converter

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI to convert'
        required: true
        type: string
      title:
        description: 'Movie title'
        required: true
        type: string
      quality:
        description: 'Quality (720p/1080p/2160p)'
        required: false
        type: string
        default: '1080p'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          aria2c --version
      
      - name: 📊 Display inputs
        run: |
          echo "🎬 Title: ${{ inputs.title }}"
          echo "📺 Quality: ${{ inputs.quality }}"
          echo "🧲 Magnet: ${MAGNET:0:80}..."
        env:
          MAGNET: ${{ inputs.magnet }}
      
      - name: ⬇️ Download torrent via aria2
        id: download
        run: |
          set -e
          
          # Create download directory
          mkdir -p downloads
          cd downloads
          
          # Download with aria2
          echo "🚀 Starting download..."
          aria2c \
            --seed-time=0 \
            --max-overall-download-limit=10M \
            --bt-max-peers=50 \
            --bt-request-peer-speed-limit=1M \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --follow-torrent=mem \
            --file-allocation=none \
            --summary-interval=30 \
            "${{ inputs.magnet }}"
          
          # Find the largest file (movie file)
          LARGEST_FILE=$(find . -type f -exec ls -lh {} + | sort -k5 -hr | head -1 | awk '{print $NF}')
          
          if [ -z "$LARGEST_FILE" ]; then
            echo "❌ No file downloaded"
            exit 1
          fi
          
          echo "✅ Downloaded: $LARGEST_FILE"
          FILE_SIZE=$(du -h "$LARGEST_FILE" | cut -f1)
          echo "📦 Size: $FILE_SIZE"
          
          # Save filename for next step
          echo "filename=$LARGEST_FILE" >> $GITHUB_OUTPUT
          echo "filesize=$FILE_SIZE" >> $GITHUB_OUTPUT
      
      - name: 🚀 Upload to file hosting
        id: upload
        run: |
          set -e
          cd downloads
          FILE="${{ steps.download.outputs.filename }}"
          
          echo "📤 Uploading to file.io..."
          
          # Upload to file.io (expires after 1 download by default)
          # We'll use max expiry (14 days) and unlimited downloads
          RESPONSE=$(curl -F "file=@$FILE" \
            -F "expires=14d" \
            -F "maxDownloads=" \
            https://file.io 2>/dev/null)
          
          echo "Response: $RESPONSE"
          
          # Extract URL using grep/sed (no jq needed)
          DIRECT_URL=$(echo "$RESPONSE" | grep -o '"link":"[^"]*"' | sed 's/"link":"//;s/"$//')
          
          if [ -z "$DIRECT_URL" ]; then
            echo "❌ Upload failed"
            exit 1
          fi
          
          echo "✅ Upload complete!"
          echo "🔗 Direct URL: $DIRECT_URL"
          
          # Save URL for output
          echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up workspace..."
          cd $GITHUB_WORKSPACE
          rm -rf downloads/*
          df -h
          echo "✅ Cleanup complete"
      
      - name: 📋 Summary
        if: success()
        run: |
          echo "## ✅ Conversion Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🎬 Movie:** ${{ inputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**📺 Quality:** ${{ inputs.quality }}" >> $GITHUB_STEP_SUMMARY
          echo "**📦 File Size:** ${{ steps.download.outputs.filesize }}" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 Direct URL:** ${{ steps.upload.outputs.direct_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**⏱️ Total Time:** ${{ github.event.workflow_run.updated_at }}" >> $GITHUB_STEP_SUMMARY
