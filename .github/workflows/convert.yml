name: Magnet to Direct HTTP Converter

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI to convert'
        required: true
        type: string
      title:
        description: 'Movie title'
        required: true
        type: string
      quality:
        description: 'Quality (1080p or 720p)'
        required: false
        default: '1080p'
        type: string
      token:
        description: 'GitHub Personal Access Token'
        required: false
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔒 Mask Token
        run: |
          if [ -n "${{ inputs.token }}" ]; then
            echo "::add-mask::${{ inputs.token }}"
          fi

      - name: 🔧 Install aria2, gh CLI & cloudflared
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl python3
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
      
      - name: 📊 Display inputs
        run: |
          echo "🎬 Title: ${{ inputs.title }}"
          echo "📺 Quality: ${{ inputs.quality }}"
      
      - name: ⬇️ Download torrent via aria2
        id: download
        run: |
          set -e
          mkdir -p downloads
          cd downloads
          
          echo "🚀 Fetching top active trackers..."
          curl -sS -L --connect-timeout 5 https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt -o /tmp/trackers.txt || true
          TRACKERS=$(grep -v '^$' /tmp/trackers.txt 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          
          echo "🚀 Starting Ultra-Speed Torrent Download..."
          aria2c \
            --seed-time=0 \
            --max-overall-download-limit=0 \
            --max-download-limit=0 \
            --max-overall-upload-limit=1K \
            --max-upload-limit=1K \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=1M \
            --bt-max-peers=200 \
            --disk-cache=64M \
            --file-allocation=none \
            --enable-dht=true \
            --enable-dht6=false \
            --bt-enable-lpd=true \
            --follow-torrent=mem \
            --summary-interval=5 \
            --bt-stop-timeout=300 \
            --timeout=120 \
            ${TRACKERS:+--bt-tracker="$TRACKERS"} \
            "${{ inputs.magnet }}"
          
          # Python to locate the largest video file
          python3 - << 'PYEOF'
          import os, sys, shutil

          videos = []
          for root, dirs, files in os.walk("."):
              for f in files:
                  ext = os.path.splitext(f)[1].lower()
                  if ext in [".mp4", ".mkv", ".avi", ".ts", ".webm", ".m4v"]:
                      full_path = os.path.join(root, f)
                      try:
                          sz = os.path.getsize(full_path)
                          if sz > 10 * 1024 * 1024:  # At least 10 MB
                              videos.append((sz, full_path, f))
                      except OSError:
                          pass

          if not videos:
              print("❌ No video media file found in torrent download!")
              sys.exit(1)

          videos.sort(key=lambda x: x[0], reverse=True)
          largest_size, largest_path, orig_name = videos[0]

          # Clean filename preserving original video extension
          ext = os.path.splitext(orig_name)[1].lower()
          base = os.path.splitext(orig_name)[0]
          clean_base = "".join(c if c.isalnum() or c in "._-" else "_" for c in base)
          clean_name = f"{clean_base}{ext}"
          dest_path = os.path.abspath(clean_name)
          
          if os.path.abspath(largest_path) != dest_path:
              shutil.move(largest_path, dest_path)

          size_human = f"{largest_size / (1024*1024):.1f} MB" if largest_size < 1024*1024*1024 else f"{largest_size / (1024*1024*1024):.2f} GB"
          print(f"✅ Downloaded Video: {clean_name} ({size_human})")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"filepath=downloads/{clean_name}\n")
                  f.write(f"filename={clean_name}\n")
                  f.write(f"filesize={size_human}\n")
          PYEOF

      - name: 🌐 Start Direct Cloudflare Tunnel & Release Signal
        id: tunnel
        env:
          GH_TOKEN: ${{ inputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="temp-$(date +%s)"
          FILENAME="${{ steps.download.outputs.filename }}"
          
          echo "Starting Python HTTP Server on port 8080..."
          cd downloads
          python3 -m http.server 8080 &
          
          echo "Starting Cloudflare Tunnel on port 8080..."
          cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          
          TUNNEL_URL=""
          for i in {1..40}; do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "⚠️ Cloudflare tunnel failed to start, using fallback release asset..."
            cd ..
            gh release create "$TAG_NAME" "${{ steps.download.outputs.filepath }}" \
              --title "Temp Release $TAG_NAME" \
              --notes "FALLBACK_URL: https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${FILENAME}"
          else
            DIRECT_URL="${TUNNEL_URL}/${FILENAME}"
            echo "🎉 DIRECT CLOUDFLARE URL READY: $DIRECT_URL"
            cd ..
            # Create lightweight release to instantly signal our local python script
            gh release create "$TAG_NAME" \
              --title "Temp Release $TAG_NAME" \
              --notes "DIRECT_URL: $DIRECT_URL"
          fi
          
          echo "⏳ Keeping Cloudflare Tunnel server alive for remote uploads (waiting up to 300s)..."
          # Wait up to 300 seconds for remote downloaders to finish
          sleep 300
