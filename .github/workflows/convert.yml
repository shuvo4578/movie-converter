name: Magnet to Direct HTTP Converter

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI to convert'
        required: true
        type: string
      title:
        description: 'Movie title'
        required: true
        type: string
      quality:
        description: 'Quality (720p/1080p/2160p)'
        required: false
        type: string
        default: '1080p'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Install aria2 & jq
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 jq curl
      
      - name: 📊 Display inputs
        run: |
          echo "🎬 Title: ${{ inputs.title }}"
          echo "📺 Quality: ${{ inputs.quality }}"
      
      - name: ⬇️ Download torrent via aria2 (High Speed)
        id: download
        run: |
          set -e
          mkdir -p downloads
          cd downloads
          
          echo "🚀 Starting High-Speed Download..."
          aria2c \
            --seed-time=0 \
            --max-overall-download-limit=0 \
            --max-download-limit=0 \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=1M \
            --bt-max-peers=100 \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --follow-torrent=mem \
            --file-allocation=none \
            --summary-interval=10 \
            --timeout=120 \
            "${{ inputs.magnet }}"
          
          # Find the largest media file
          LARGEST_FILE=$(find . -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" \) | head -1)
          if [ -z "$LARGEST_FILE" ]; then
            LARGEST_FILE=$(find . -type f -exec ls -lh {} + | sort -k5 -hr | head -1 | awk '{print $NF}')
          fi
          
          if [ -z "$LARGEST_FILE" ]; then
            echo "❌ No file downloaded"
            exit 1
          fi
          
          echo "✅ Downloaded: $LARGEST_FILE"
          FILE_SIZE=$(du -h "$LARGEST_FILE" | cut -f1)
          echo "📦 Size: $FILE_SIZE"
          
          echo "filepath=$LARGEST_FILE" >> $GITHUB_OUTPUT
          echo "filesize=$FILE_SIZE" >> $GITHUB_OUTPUT
      
      - name: 🚀 Upload to Direct Cloud Hosting
        id: upload
        run: |
          set -e
          cd downloads
          FILE="${{ steps.download.outputs.filepath }}"
          
          echo "📤 Uploading to tmpfiles.org..."
          RESP=$(curl -s -F "file=@$FILE" https://tmpfiles.org/api/v1/upload || true)
          URL=$(echo "$RESP" | jq -r '.data.url // empty' || true)
          
          if [ -n "$URL" ]; then
            # Convert view url to direct download url: https://tmpfiles.org/12345/abc.mkv -> https://tmpfiles.org/dl/12345/abc.mkv
            DIRECT_URL=$(echo "$URL" | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//')
            echo "✅ tmpfiles URL: $DIRECT_URL"
          else
            echo "⚠️ tmpfiles failed, uploading to file.io..."
            FIO_RESP=$(curl -s -F "file=@$FILE" https://file.io || true)
            DIRECT_URL=$(echo "$FIO_RESP" | jq -r '.link // empty' || true)
          fi
          
          if [ -z "$DIRECT_URL" ]; then
            echo "❌ All uploads failed"
            exit 1
          fi
          
          echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
          echo "🔗 Final Direct URL: $DIRECT_URL"
      
      - name: 📋 Summary
        if: success()
        run: |
          echo "## ✅ Conversion Complete!" >> $GITHUB_STEP_SUMMARY
          echo "**🎬 Movie:** ${{ inputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**📦 File Size:** ${{ steps.download.outputs.filesize }}" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 Direct HTTP Link:** ${{ steps.upload.outputs.direct_url }}" >> $GITHUB_STEP_SUMMARY
