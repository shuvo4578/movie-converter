name: Magnet to Direct HTTP Converter

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: 'Magnet URI to convert'
        required: true
        type: string
      title:
        description: 'Movie title'
        required: true
        type: string
      quality:
        description: 'Quality (720p/1080p)'
        required: false
        type: string
        default: '1080p'

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Install aria2 & python3
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 python3 curl
      
      - name: 📊 Display inputs
        run: |
          echo "🎬 Title: ${{ inputs.title }}"
          echo "📺 Quality: ${{ inputs.quality }}"
      
      - name: ⬇️ Download torrent via aria2 (High Speed)
        id: download
        run: |
          set -e
          mkdir -p downloads
          cd downloads
          
          echo "🚀 Starting High-Speed Download..."
          aria2c \
            --seed-time=0 \
            --max-overall-download-limit=0 \
            --max-download-limit=0 \
            --split=16 \
            --max-connection-per-server=16 \
            --min-split-size=1M \
            --bt-max-peers=100 \
            --enable-dht=true \
            --bt-enable-lpd=true \
            --follow-torrent=mem \
            --file-allocation=none \
            --summary-interval=10 \
            --timeout=120 \
            "${{ inputs.magnet }}"
          
          # Find the largest media file
          LARGEST_FILE=$(find . -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.avi" \) | head -1)
          if [ -z "$LARGEST_FILE" ]; then
            LARGEST_FILE=$(find . -type f -exec ls -lh {} + | sort -k5 -hr | head -1 | awk '{print $NF}')
          fi
          
          if [ -z "$LARGEST_FILE" ]; then
            echo "❌ No file downloaded"
            exit 1
          fi
          
          echo "✅ Downloaded: $LARGEST_FILE"
          FILE_SIZE=$(du -h "$LARGEST_FILE" | cut -f1)
          echo "📦 Size: $FILE_SIZE"
          
          echo "filepath=$LARGEST_FILE" >> $GITHUB_OUTPUT
          echo "filesize=$FILE_SIZE" >> $GITHUB_OUTPUT
      
      - name: 🚀 Upload to Direct Cloud Hosting
        id: upload
        run: |
          cd downloads
          FILE="${{ steps.download.outputs.filepath }}"
          
          python3 - << 'EOF'
          import os, sys, json, urllib.request, subprocess

          filepath = os.environ.get("FILE", "").strip()
          if filepath.startswith("./"):
              filepath = filepath[2:]
          
          print(f"Uploading file: {filepath}")
          direct_url = ""

          # 1. Try Pixeldrain (supports up to 10GB)
          try:
              print("Trying Pixeldrain...")
              cmd = ["curl", "-s", "-X", "PUT", "--upload-file", filepath, f"https://pixeldrain.com/api/file/{os.path.basename(filepath)}"]
              res = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
              data = json.loads(res.stdout)
              if data.get("success"):
                  file_id = data["id"]
                  direct_url = f"https://pixeldrain.com/api/file/{file_id}"
                  print(f"✅ Pixeldrain Direct Link: {direct_url}")
          except Exception as e:
              print(f"Pixeldrain failed: {e}")

          # 2. Try Gofile if Pixeldrain failed
          if not direct_url:
              try:
                  print("Trying Gofile...")
                  srv_req = urllib.request.Request("https://api.gofile.io/servers", headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(srv_req, timeout=10) as srv_resp:
                      srv_data = json.loads(srv_resp.read().decode())
                      server = srv_data["data"]["servers"][0]["name"]
                  
                  upload_url = f"https://{server}.gofile.io/contents/uploadfile"
                  cmd = ["curl", "-s", "-F", f"file=@{filepath}", upload_url]
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  g_data = json.loads(res.stdout)
                  if g_data.get("status") == "ok":
                      direct_url = g_data["data"]["downloadPage"]
                      print(f"✅ Gofile Link: {direct_url}")
              except Exception as e:
                  print(f"Gofile failed: {e}")

          # 3. Try Bashupload as fallback (50GB limit)
          if not direct_url:
              try:
                  print("Trying Bashupload...")
                  cmd = ["curl", "-s", "https://bashupload.com", "-T", filepath]
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  for line in res.stdout.splitlines():
                      if "http" in line:
                          direct_url = line.strip()
                          print(f"✅ Bashupload Link: {direct_url}")
                          break
              except Exception as e:
                  print(f"Bashupload failed: {e}")

          if not direct_url:
              print("❌ All uploaders failed!")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"direct_url={direct_url}\n")
          EOF
        env:
          FILE: ${{ steps.download.outputs.filepath }}
      
      - name: 📋 Summary
        if: success()
        run: |
          echo "## ✅ Conversion Complete!" >> $GITHUB_STEP_SUMMARY
          echo "**🎬 Movie:** ${{ inputs.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**📦 File Size:** ${{ steps.download.outputs.filesize }}" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 Direct HTTP Link:** ${{ steps.upload.outputs.direct_url }}" >> $GITHUB_STEP_SUMMARY
